name: iOS Cloud Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Shared KMP Framework
        run: ./gradlew :composeApp:assembleComposeAppReleaseFramework

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild -project PanicButton.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PanicButton-iPhone-App
          path: build/Build/Products/Release-iphoneos/iosApp.app
          retention-days: 7
